<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ---------- sound (tiny synth, no files) ----------
let ac = null;
function audio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} return ac; }
addEventListener('pointerdown', audio);
addEventListener('keydown', audio);
function tone(f0, f1, dur, type = 'sine', vol = 0.15) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, a.currentTime); o.frequency.exponentialRampToValueAtTime(f1, a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, vol = 0.2) {
  const a = audio(); if (!a) return;
  const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = a.createBufferSource(), g = a.createGain(); g.gain.value = vol;
  src.buffer = buf; src.connect(g); g.connect(a.destination); src.start();
}
function sfx(k) {
  if (k === 'coin') tone(880, 1320, 0.12, 'triangle', 0.1);
  else if (k === 'crash') noise(0.3, 0.25);
  else if (k === 'bonk') tone(320, 70, 0.35, 'square', 0.12);
  else if (k === 'launch') tone(200, 900, 0.45, 'sine', 0.15);
  else if (k === 'timber') tone(140, 50, 0.45, 'sawtooth', 0.12);
  else if (k === 'shell') tone(160, 330, 0.2, 'sine', 0.15);
  else if (k === 'jump') tone(300, 620, 0.14, 'sine', 0.1);
  else if (k === 'win') { tone(523, 1047, 0.5, 'triangle', 0.15); }
}

// ---------- renderer, scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0x998866, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(4, 8, 3);
sun.castShadow = true;
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
scene.add(sun, sun.target);
const mat = (c) => new THREE.MeshLambertMaterial({ color: c });

// ---------- physics ----------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.8, 0) });
world.allowSleep = true;
world.defaultContactMaterial.friction = 0.35;
world.defaultContactMaterial.restitution = 0.25;
const baseMat = new CANNON.Material('base'); // everything except Lena
const ROOM = 6;
function staticBox(hx, hy, hz, x, y, z) {
  const b = new CANNON.Body({ mass: 0, material: baseMat, shape: new CANNON.Box(new CANNON.Vec3(hx, hy, hz)) });
  b.position.set(x, y, z);
  world.addBody(b);
  return b;
}
staticBox(ROOM, 0.1, ROOM, 0, -0.1, 0);
staticBox(ROOM, 2, 0.1, 0, 2, -ROOM);
staticBox(ROOM, 2, 0.1, 0, 2, ROOM);
staticBox(0.1, 2, ROOM, -ROOM, 2, 0);
staticBox(0.1, 2, 2.3, ROOM, 2, -3.7);   // east wall, with a doorway to the garden
staticBox(0.1, 2, 2.3, ROOM, 2, 3.7);

// ---------- the room ----------
const floor = new THREE.Mesh(new THREE.BoxGeometry(ROOM * 2, 0.2, ROOM * 2), mat(0xc89a62));
floor.position.y = -0.1; floor.receiveShadow = true; scene.add(floor);
for (let i = -ROOM; i < ROOM; i += 1) {
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.01, ROOM * 2), mat(0x9a7344));
  line.position.set(i, 0.005, 0); scene.add(line);
}
const wallMat = mat(0xf6ecd6);
for (const [x, z, ry, len] of [[0, -ROOM, 0, ROOM * 2], [0, ROOM, 0, ROOM * 2], [-ROOM, 0, Math.PI / 2, ROOM * 2], [ROOM, -3.7, Math.PI / 2, 4.6], [ROOM, 3.7, Math.PI / 2, 4.6]]) {
  const w = new THREE.Mesh(new THREE.BoxGeometry(len, 4, 0.2), wallMat);
  w.position.set(x, 2, z); w.rotation.y = ry; w.receiveShadow = true; scene.add(w);
}
const rug = new THREE.Mesh(new THREE.BoxGeometry(5, 0.02, 3.4), mat(0xb5483a));
rug.position.set(0, 0.011, 1); rug.receiveShadow = true; scene.add(rug);
function staticFurniture(w, h, d, x, z, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.position.set(x, h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  staticBox(w / 2, h / 2, d / 2, x, h / 2, z);
}
staticFurniture(2.6, 0.5, 1.0, -3.2, -5.3, 0x4a6fa5);
staticFurniture(2.6, 0.5, 0.25, -3.2, -5.75, 0x3b5a87);
staticFurniture(1.6, 0.9, 0.5, 4.6, -5.5, 0x7a5232);

// ---------- props ----------
const props = []; // { mesh, body, kind, alive }
const pendingBreaks = new Set();
// progress (coins, skins) is saved on this device so the kids keep what they bought
const SAVE_KEY = 'i-am-lena-save';
let save = { coins: 0, owned: ['brown'], skin: 'brown', done: [], patterns: ['hex', 'none'], pattern: 'hex' };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
if (!save.owned.includes('brown')) save.owned.push('brown');
if (!save.migrated) { save.migrated = 1; if (save.skin === 'green') save.skin = 'brown'; } // Lena is brown now
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
let coins = save.coins;
function addCoins(n) { coins += n; save.coins = coins; persist(); sfx('coin'); }
function addProp(kind, x, y, z, ry = 0) {
  let mesh, shape, mass;
  if (kind === 'vase') {
    mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.36, 12), mat([0x3aa6c9, 0xd9534f, 0xe9b949][props.length % 3]));
    shape = new CANNON.Box(new CANNON.Vec3(0.1, 0.18, 0.1)); mass = 0.6;
  } else if (kind === 'crate') {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat(0xb8803c));
    shape = new CANNON.Box(new CANNON.Vec3(0.25, 0.25, 0.25)); mass = 2;
  } else if (kind === 'ball') {
    mesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), mat(0xe04a8a));
    shape = new CANNON.Sphere(0.2); mass = 0.8;
  } else if (kind === 'table') {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.6), mat(0x8a5a33));
    shape = new CANNON.Box(new CANNON.Vec3(0.3, 0.35, 0.3)); mass = 5;
  } else if (kind === 'book') {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.32, 0.22), mat([0xc0392b, 0x2980b9, 0x27ae60, 0xf39c12, 0x8e44ad][props.length % 5]));
    shape = new CANNON.Box(new CANNON.Vec3(0.025, 0.16, 0.11)); mass = 0.15;
  } else if (kind === 'lamp') {
    mesh = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 1.2, 8), mat(0x333333));
    const shade = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.3, 12, 1, true), new THREE.MeshLambertMaterial({ color: 0xffe27a, side: THREE.DoubleSide }));
    shade.position.y = 0.6;
    mesh.add(pole, shade);
    shape = new CANNON.Box(new CANNON.Vec3(0.08, 0.6, 0.08)); mass = 1.5;
  }
  mesh.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  scene.add(mesh);
  const body = new CANNON.Body({ mass, shape, material: baseMat, sleepSpeedLimit: 0.15, sleepTimeLimit: 0.6 });
  body.position.set(x, y, z);
  body.quaternion.setFromEuler(0, ry, 0);
  world.addBody(body);
  const p = { mesh, body, kind, alive: true, breakable: kind === 'vase' || kind === 'lamp', home: { kind, x, y, z, ry } };
  body.addEventListener('collide', (e) => {
    if (p.breakable && p.alive && !p.held && Math.abs(e.contact.getImpactVelocityAlongNormal()) > 1.0) pendingBreaks.add(p);
  });
  props.push(p);
  return p;
}
// vases on the floor
for (const [x, z] of [[-4, 2], [-1.5, 4], [3.5, 3.5], [4.5, 0], [-4.5, -2], [1.5, -1]]) addProp('vase', x, 0.18, z);
// side tables with vases on top
addProp('table', -2.5, 0.35, -2.5); addProp('table', 2.8, 0.35, -3);
addProp('vase', -2.5, 0.88, -2.5); addProp('vase', 2.8, 0.88, -3);
// crate pyramid
for (const [x, y, z] of [[0, 0.25, -4], [0.55, 0.25, -4], [-0.55, 0.25, -4], [0.27, 0.75, -4], [-0.27, 0.75, -4], [0, 1.25, -4]]) addProp('crate', x, y, z);
// balls and lamps
for (const [x, z] of [[2, 1], [-2, 1.5], [0.5, 3]]) addProp('ball', x, 0.2, z);
addProp('lamp', 5, 0.6, 3); addProp('lamp', -5, 0.6, 4);

// ---------- the rafters: a long beam up the left wall, reached by hopping up the steps ----------
const LOFT_Y = 2.0;
const loft = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.16, 7), mat(0x7a5232));
loft.position.set(-5.1, LOFT_Y, -0.5); loft.castShadow = loft.receiveShadow = true; scene.add(loft);
staticBox(0.9, 0.08, 3.5, -5.1, LOFT_Y, -0.5);
for (const pz of [-3.8, 2.8]) {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.18, LOFT_Y, 0.18), mat(0x5e3f23));
  post.position.set(-4.3, LOFT_Y / 2, pz); post.castShadow = true; scene.add(post);
  staticBox(0.09, LOFT_Y / 2, 0.09, -4.3, LOFT_Y / 2, pz);
}
const TOP = LOFT_Y + 0.08;
for (const [kind, z] of [['crate', -3.0], ['ball', -2.2], ['vase', -1.5], ['crate', -0.6], ['ball', 0.2], ['vase', 1.0], ['crate', 1.9]]) {
  addProp(kind, -5.4, TOP + (kind === 'crate' ? 0.25 : kind === 'ball' ? 0.2 : 0.18) + 0.02, z);
}
// launch pads are gone: Lena jumps now. Wooden steps lead up to the rafters and the fridge.
const PADS = [];
function addStep(cx, cz, w, h, d, color = 0xd9a867) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.position.set(cx, h / 2, cz); m.castShadow = m.receiveShadow = true; scene.add(m);
  staticBox(w / 2, h / 2, d / 2, cx, h / 2, cz);
}
for (const [i, cx] of [-2.4, -3.1, -3.8].entries()) addStep(cx, -0.5, 0.7, 0.45 * (i + 1), 1.0, [0xd9a867, 0xcf9a58, 0xc58c4a][i]);   // up to the rafters
for (const [i, cx] of [0.3, 0.9, 1.475].entries()) addStep(cx, -5.5, i === 2 ? 0.55 : 0.6, 0.45 * (i + 1), 0.9, [0xd9a867, 0xcf9a58, 0xc58c4a][i]); // up to the fridge
const drift = { t: 0, x: 0, z: 0 };
let padCool = 0, wasOnLoft = false, wasOnFridge = false;

// ---------- mission pack: Lena flavoured versions of I Am Cat's tasks ----------
// fridge (king of the fridge)
const FRIDGE = { x: 2.2, z: -5.5, top: 1.9 };
{
  const f = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.9, 0.8), mat(0xf2f2f2));
  f.position.set(FRIDGE.x, 0.95, FRIDGE.z); f.castShadow = f.receiveShadow = true; scene.add(f);
  staticBox(0.45, 0.95, 0.4, FRIDGE.x, 0.95, FRIDGE.z);
  const h = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.5, 0.05), mat(0x999999)); h.position.set(FRIDGE.x + 0.3, 1.1, FRIDGE.z + 0.42); scene.add(h);
}
// radio (disco)
const RADIO = { x: 5.4, z: 2.6 };
{
  const r = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.25), mat(0xd23f3f));
  r.position.set(RADIO.x, 0.15, RADIO.z); r.castShadow = true; scene.add(r);
  staticBox(0.25, 0.15, 0.125, RADIO.x, 0.15, RADIO.z);
  const sp = new THREE.Mesh(new THREE.CircleGeometry(0.09, 16), mat(0x222222)); sp.position.set(RADIO.x - 0.13, 0.15, RADIO.z + 0.13); scene.add(sp);
}
const disco = { t: 0, beat: 0, cool: 0, i: 0 };
// domino library: 12 books standing in a row, push the first
for (let i = 0; i < 12; i++) addProp('book', 0.2 + i * 0.16, 0.16, 5.3);
// paintings to say hi to
const paintings = [];
function addPainting(x, z, ry, emoji, bg) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, 128, 128);
  g.font = '80px serif'; g.textAlign = 'center'; g.fillText(emoji, 64, 92);
  const grp = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.46, 0.05), new THREE.MeshLambertMaterial({ color: 0x5e3f23 }));
  const pic = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.36), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c) }));
  pic.position.z = 0.03; grp.add(frame, pic);
  grp.position.set(x, 0.3, z); grp.rotation.y = ry; scene.add(grp);
  paintings.push({ x, z, frame, touched: false, emoji });
}
addPainting(-5.4, -5.85, 0, '🦖', '#cfe8c0'); addPainting(-0.45, -5.85, 0, '🚀', '#1c2a4a');
addPainting(-1.4, -5.85, 0, '🐢', '#bfe3f5'); addPainting(3.2, -5.85, 0, '🥬', '#e5f5c8');
addPainting(5.85, -3.2, -Math.PI / 2, '⭐', '#2a2a40'); addPainting(5.85, 4.4, -Math.PI / 2, '🦕', '#f5e0c0');
// balloons: some on the floor, two on the launch arc, two up in the rafters
const balloons = [];
function addBalloon(x, y, z, color, tether) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 12), new THREE.MeshLambertMaterial({ color })); b.scale.y = 1.2; g.add(b);
  const len = tether ? y : 0.35;
  const str = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, len, 4), mat(0xffffff)); str.position.y = -0.2 - len / 2; g.add(str);
  g.position.set(x, y, z); scene.add(g);

const hold = { p: null };
function dropHeld() { const p = hold.p; if (!p) return null; p.held = false; p.body.collisionResponse = true; p.body.wakeUp(); hold.p = null; return p; }
function grabOrThrow() {
  if (paused) return;
  if (hold.p) {
    const p = dropHeld();
    p.body.velocity.set(Math.sin(yaw) * 7 + lenaBody.velocity.x, 3, Math.cos(yaw) * 7 + lenaBody.velocity.z);
    credit('throws'); sfx('launch'); renderHud();
    return;
  }
  let best = null, bd = 1.2;
  for (const p of props) {
    if (!p.alive || p.body.mass > 2.5 || p.kind === 'table') continue;
    const dx = p.body.position.x - lenaBody.position.x, dz = p.body.position.z - lenaBody.position.z;
    const d = Math.hypot(dx, dz);
    if (d < bd && Math.abs(p.body.position.y - lenaBody.position.y) < 1.0) { best = p; bd = d; }
  }
  if (best) { hold.p = best; best.held = true; best.body.collisionResponse = false; sfx('coin'); }
  else toast('Nothing to grab here');
}

// ---------- Uncle Adam behaviour ----------
// Slapstick, never violent: a bonk launches him up spinning, he lands dizzy with stars, then shakes it off.
function bonkAdam(prop) {
  if (A.state !== 'patrol') return;
  disco.t = 0;
  if (prop && prop.high && credit('drops')) { addCoins(15); toast('FROM THE RAFTERS! +15'); sfx('bonk'); }
  A.state = 'flying'; A.t = 0; A.bonks++; credit('bonks'); addCoins(10);
  toast('BONK! Uncle Adam! +10'); sfx('bonk');
  renderHud(); checkWin();
}
function updateAdam(dt) {
  const lp = lenaBody.position;
  const dL = Math.hypot(lp.x - adam.position.x, lp.z - adam.position.z);
  A.grace = Math.max(0, A.grace - dt);

  if (A.state === 'flying') {
    A.t += dt;
    const T = 1.8, k = Math.min(1, A.t / T);
    adam.position.y = 2.4 * Math.sin(Math.PI * k);
    adam.rotation.x = k * Math.PI * 2;
    adam.rotation.y += dt * 10;
    if (k >= 1) {
      A.state = 'dizzy'; A.t = 0;
      adam.rotation.x = 0; adam.position.y = 0; stars.visible = true;
      adam.position.x = Math.max(-5.3, Math.min(5.3, adam.position.x));
      adam.position.z = Math.max(-5.3, Math.min(5.3, adam.position.z));
    }
    return;
  }
  if (A.state === 'dizzy') {
    A.t += dt;
    stars.children.forEach((s, i) => { const a = s.userData.a + A.t * 5; s.position.set(Math.cos(a) * 0.3, Math.sin(A.t * 8 + i) * 0.04, Math.sin(a) * 0.3); });
    adam.rotation.z = Math.sin(A.t * 6) * 0.15;
    if (A.t > 2.2) { A.state = 'patrol'; stars.visible = false; adam.rotation.z = 0; A.grace = 1.5; A.angry = 25; setAdamMood(true); toast('Uncle Adam is MAD! Run!'); }
    return;
  }

  // hit by rolling shell or a flying prop
  const lenaUp = lp.y > 1.0; // up in the rafters, out of his reach
  if (!lenaUp && S.on && dL < 0.85 && lenaBody.velocity.length() > 1.5) { bonkAdam(); return; }
  for (const p of props) {
    if (!p.alive || p.kind === 'table') continue;
    const bp = p.body.position;
    if (bp.y < 2.2 && Math.hypot(bp.x - adam.position.x, bp.z - adam.position.z) < 0.6 && p.body.velocity.length() > 3) { bonkAdam(p); return; }
  }

  if (disco.t > 0) { // the radio is on: Uncle Adam cannot help dancing
    const t = performance.now() / 1000;
    adam.rotation.y += dt * 3;
    adam.position.y = Math.abs(Math.sin(t * 8)) * 0.12;
    aarms[0].rotation.z = 2.4 + Math.sin(t * 9) * 0.4; aarms[1].rotation.z = -2.4 - Math.sin(t * 9) * 0.4;
    alegs[0].rotation.x = Math.sin(t * 8) * 0.5; alegs[1].rotation.x = -Math.sin(t * 8) * 0.5;
    return;
  }
  adam.position.y = 0; aarms[0].rotation.z = 0; aarms[1].rotation.z = 0;
  A.angry = Math.max(0, A.angry - dt);
  if (A.mad && A.angry <= 0) { setAdamMood(false); toast('Uncle Adam calmed down'); }
  const hidden = BOX.inside;
  let target = WAYPOINTS[wp], speed = 1.0;
  if (A.angry > 0 && !S.on && !lenaUp && !hidden && A.grace <= 0 && dL < 3.2) { target = new THREE.Vector3(lp.x, 0, lp.z); speed = 1.3; } // Lena (1.6) can outrun him
  const dx = target.x - adam.position.x, dz = target.z - adam.position.z;
  const d = Math.hypot(dx, dz);
  if (d < 0.2) wp = (wp + 1) % WAYPOINTS.length;
  else {
    adam.position.x += (dx / d) * speed * dt;
    adam.position.z += (dz / d) * speed * dt;
    const want = Math.atan2(dx, dz);
    const diff = Math.atan2(Math.sin(want - adam.rotation.y), Math.cos(want - adam.rotation.y));
    adam.rotation.y += diff * Math.min(1, dt * 6);
    const sw = Math.sin(performance.now() / 180 * speed);
    alegs[0].rotation.x = sw * 0.5; alegs[1].rotation.x = -sw * 0.5;
    aarms[0].rotation.x = -sw * 0.4; aarms[1].rotation.x = sw * 0.4;
  }
  // a tortoise out of her shell gets carried back to the start
  if (A.angry > 0 && !S.on && !lenaUp && !hidden && A.grace <= 0 && dL < 0.7) {
    lenaBody.position.copy(LENA_START); lenaBody.velocity.set(0, 0, 0);
    A.grace = 3;
    toast('Gotcha, Lena! Back to the start!');
  }
}

// ---------- game loop ----------
const SPEED = 1.6, SHELL_SPEED = 3.4;
let yaw = Math.PI, walk = 0;
const clock = new THREE.Clock();
camera.position.set(0, 3, 5.5);
const upVec = new CANNON.Vec3(0, 1, 0);
// the camera stays on the same side of the wall as Lena
function camBounds(lx) { return lx < 6 ? { x0: -5.6, x1: 5.6, z0: -5.6, z1: 5.6 } : { x0: 6.4, x1: 17.6, z0: -5.6, z1: 5.6 }; }
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (paused) { renderer.render(scene, camera); requestAnimationFrame(frame); return; }
  let ix = input.x, iy = input.y;
  if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
  if (keys.has('d') || keys.has('arrowright')) ix += 1;
  if (keys.has('w') || keys.has('arrowup')) iy -= 1;
  if (keys.has('s') || keys.has('arrowdown')) iy += 1;
  const mag = Math.min(1, Math.hypot(ix, iy));

  if (S.on) { S.t -= dt; if (S.t <= 0) popOut(); }
  else if (S.cool > 0) S.cool -= dt;
  shellBtn.className = S.on ? 'on' : S.cool > 0 ? 'cool' : '';
  shellBtn.textContent = S.on ? Math.ceil(S.t) + '...' : S.cool > 0 ? 'wait' : 'SHELL!';

  const speed = S.on ? SHELL_SPEED : SPEED;
  const n = Math.hypot(ix, iy); if (n > 1) { ix /= n; iy /= n; }
  if (firstPerson) {
    // first person: drag to look, stick walks forward/back and sidesteps
    if (mag > 0.08) {
      lenaBody.velocity.x = (Math.sin(yaw) * -iy - Math.cos(yaw) * ix) * speed;
      lenaBody.velocity.z = (Math.cos(yaw) * -iy + Math.sin(yaw) * ix) * speed;
      walk += dt * 9 * mag;
    } else { lenaBody.velocity.x *= 0.8; lenaBody.velocity.z *= 0.8; }
  } else if (mag > 0.08) {
    // movement is relative to the camera: stick-up walks away from it
    const wx = Math.cos(camAz) * ix + -Math.sin(camAz) * -iy;
    const wz = -Math.sin(camAz) * ix + -Math.cos(camAz) * -iy;
    const target = Math.atan2(wx, wz);
    const d = Math.atan2(Math.sin(target - yaw), Math.cos(target - yaw));
    yaw += d * Math.min(1, dt * 8);
    lenaBody.velocity.x = Math.sin(yaw) * speed * mag;
    lenaBody.velocity.z = Math.cos(yaw) * speed * mag;
    walk += dt * 9 * mag;
  } else {
    lenaBody.velocity.x *= 0.8; lenaBody.velocity.z *= 0.8;
  }
  // jump
  jumpCool = Math.max(0, jumpCool - dt);
  if (jumpReq) { jumpReq = false; if (jumpCool <= 0 && Math.abs(lenaBody.velocity.y) < 0.8) { lenaBody.velocity.y = 5.8; jumpCool = 0.3; sfx('jump'); } }
  // carrying something in front of her
  if (hold.p) {
    const hp = hold.p;
    if (!hp.alive) hold.p = null;
    else {
      hp.body.position.set(lenaBody.position.x + Math.sin(yaw) * 0.75, lenaBody.position.y + 0.3, lenaBody.position.z + Math.cos(yaw) * 0.75);
      hp.body.velocity.set(0, 0, 0); hp.body.angularVelocity.set(0, 0, 0); hp.body.wakeUp();
    }
  }
  grabBtn.textContent = hold.p ? 'THROW!' : 'GRAB'; grabBtn.className = hold.p ? 'hold' : '';
  if (drift.t > 0) { lenaBody.velocity.x += drift.x; lenaBody.velocity.z += drift.z; drift.t -= dt; }
  const onLoft = lenaBody.position.y > 2.0 && lenaBody.position.x < -4.2;
  if (onLoft && !wasOnLoft && credit('loft')) { addCoins(15); toast('RAFTERS! +15'); renderHud(); }
  wasOnLoft = onLoft;
  const onFridge = lenaBody.position.y > 1.8 && Math.abs(lenaBody.position.x - FRIDGE.x) < 0.5 && Math.abs(lenaBody.position.z - FRIDGE.z) < 0.45;
  if (onFridge && !wasOnFridge && credit('fridge')) renderHud();
  wasOnFridge = onFridge;
  lenaBody.wakeUp();

  world.step(1 / 60, dt, 3);

  for (const p of pendingBreaks) if (p.alive) breakProp(p);
  pendingBreaks.clear();
  for (const p of props) {
    if (!p.alive) continue;
    p.mesh.position.copy(p.body.position);
    p.mesh.quaternion.copy(p.body.quaternion);
    if (p.body.position.y > 1.6) p.high = true;
    if (p.kind === 'book' && !p.toppled && p.body.quaternion.vmult(upVec).y < 0.7) { p.toppled = true; if (credit('books')) { sfx('coin'); renderHud(); } }
    if (p.kind === 'table' && !p.toppled && p.body.quaternion.vmult(upVec).y < 0.75) {
      p.toppled = true; if (credit('tables')) { addCoins(8); toast('TIMBER! +8'); sfx('timber'); renderHud(); }
    }
  }

  lena.position.set(lenaBody.position.x, lenaBody.position.y - 0.14, lenaBody.position.z);
  lena.rotation.y = yaw;
  if (S.on) shellGroup.rotation.x += dt * 14;
  legs.forEach((l, i) => { l.position.y = 0.06 + Math.max(0, Math.sin(walk + (i % 3 ? 0 : Math.PI))) * 0.03; });

  { // mission pack checks
    const lp = lenaBody.position;
    disco.cool = Math.max(0, disco.cool - dt);
    if (disco.t <= 0 && disco.cool <= 0 && lp.y < 0.6 && Math.hypot(lp.x - RADIO.x, lp.z - RADIO.z) < 0.8) {
      disco.t = 6; disco.cool = 9; credit('disco'); toast('DISCO TIME!'); renderHud();
    }
    if (disco.t > 0) {
      disco.t -= dt; disco.beat -= dt;
      if (disco.beat <= 0) { disco.beat = 0.22; { const f = [262, 330, 392, 523, 392, 330][disco.i++ % 6]; tone(f, f, 0.18, 'square', 0.06); } }
    }
    for (const pt of paintings) {
      if (!pt.touched && isActive('paintings') && lp.y < 0.8 && Math.hypot(lp.x - pt.x, lp.z - pt.z) < 0.7) {
        pt.touched = true; pt.frame.material.color.setHex(0x55dd66); credit('paintings'); sfx('coin'); toast(`Hi ${pt.emoji}!`); renderHud();
      }
    }
    for (const b of balloons) {
      if (!b.alive || !isActive('balloons')) continue;
      b.ph += dt * 2; b.g.position.y = b.y + Math.sin(b.ph) * 0.04;
      if (Math.hypot(lp.x - b.x, lp.z - b.z, lp.y - b.y) < 0.5) {
        b.alive = false; b.g.visible = false; burst(new THREE.Vector3(b.x, b.y, b.z), b.color, 8);
        credit('balloons'); tone(900, 200, 0.12, 'square', 0.12); toast(`POP! ${Q.balloons}/8`); renderHud();
      }
    }
    updateHunt(dt);
    updateGarden(dt);
    BOX.inside = Math.abs(lp.x - BOX.x) < 0.3 && Math.abs(lp.z - BOX.z) < 0.45 && lp.y < 0.5;
    if (BOX.inside) { BOX.t += dt; if (isActive('box')) { timerEl.textContent = `Hiding... ${Math.max(0, Math.ceil(3 - BOX.t))}`; if (BOX.t >= 3) { credit('box'); timerEl.textContent = ''; toast('HIDDEN! Uncle Adam cannot find you'); renderHud(); } } }
    else { BOX.t = 0; if (!HUNT.active) timerEl.textContent = ''; }
  }
  updateAdam(dt);
  adam.position.x = Math.min(adam.position.x, 5.3); // Uncle Adam stays indoors
  sun.position.set(lenaBody.position.x + 4, 8, lenaBody.position.z + 3); sun.target.position.set(lenaBody.position.x, 0, lenaBody.position.z);
  updateShards(dt);
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) toastEl.style.opacity = 0; }

  const lp2 = lena.position;
  if (firstPerson) {
    const fx = Math.sin(yaw), fz = Math.cos(yaw);
    camera.position.set(lp2.x + fx * 0.3, lp2.y + 0.45, lp2.z + fz * 0.3);
    camera.lookAt(lp2.x + fx * 3, lp2.y + 0.35 + Math.tan(fpPitch) * 3, lp2.z + fz * 3);
  } else {
    // orbit around Lena, but keep the camera inside the walls so they never block the view
    const rh = camD * Math.cos(camEl), hh = 0.4 + camD * Math.sin(camEl);
    let cx = lp2.x + Math.sin(camAz) * rh, cz = lp2.z + Math.cos(camAz) * rh;
    const b = camBounds(lp2.x);
    cx = Math.max(b.x0, Math.min(b.x1, cx)); cz = Math.max(b.z0, Math.min(b.z1, cz));
    const k = Math.min(1, dt * 6);
    camera.position.x += (cx - camera.position.x) * k;
    camera.position.z += (cz - camera.position.z) * k;
    camera.position.y += (lp2.y + hh - camera.position.y) * k;
    camera.lookAt(lp2.x, lp2.y + 0.4, lp2.z);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
window.__game = { droid, lettuces, TREX, hold, grabOrThrow, setView, cycleView, get camAz() { return camAz; }, lenaBody, adam, props, Q, S, A, tuckIn, toggleView, get active() { return active; }, isActive, credit, bugs, HUNT, missionDone, balloons, paintings, BOX, disco, get yaw() { return yaw; }, keys, input, world };
</script>
</body>
