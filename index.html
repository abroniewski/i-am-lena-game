// Show the name gate immediately (before Three.js). iPad was stuck on the sky-blue canvas
// while the module loaded, and body touch-action:none blocked the form.
(function () {
  var gate = document.getElementById('playerGate');
  var form = document.getElementById('playerForm');
  var input = document.getElementById('playerNameInput');
  var hint = document.getElementById('playerHint');
  if (!gate || !form || !input) return;
  gate.classList.add('open');
  try {
    var saved = localStorage.getItem('i-am-lena-player-name');
    if (saved) input.value = saved;
  } catch (e) {}
  function showLoading() {
    gate.classList.add('open');
    gate.classList.add('loading');
    if (hint) hint.textContent = "Loading Lina's house…";
    var btn = form.querySelector('button[type="submit"]');
    if (btn) btn.disabled = true;
    input.readOnly = true;
    try { input.blur(); } catch (err) {}
    try { window.scrollTo(0, 0); } catch (err) {}
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    e.stopPropagation();
    if (!window.LinaAnalytics || !LinaAnalytics.setPlayer(input.value, { source: 'gate' })) {
      if (hint) hint.textContent = 'Please type a name with letters.';
      return;
    }
    window.__linaNameReady = true;
    // Never reveal the empty sky-blue body before the Three.js module has booted.
    if (window.__linaGameBooted) {
      gate.classList.remove('open');
      gate.classList.remove('loading');
    } else {
      showLoading();
    }
  });
  setTimeout(function () {
    if (!window.__linaGameBooted && window.__linaNameReady && hint) {
      hint.textContent = 'Still loading… try refreshing.';
    }
  }, 12000);
})();

function fillRoundRect(g, x, y, w, h, r) {
  // Canvas roundRect is missing on older iPad Safari — path works everywhere.
  const rr = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + rr, y);
  g.lineTo(x + w - rr, y);
  g.quadraticCurveTo(x + w, y, x + w, y + rr);
  g.lineTo(x + w, y + h - rr);
  g.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  g.lineTo(x + rr, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - rr);
  g.lineTo(x, y + rr);
  g.quadraticCurveTo(x, y, x + rr, y);
  g.closePath();
  g.fill();
}

const hold = { p: null };

function findNearbyFood() {
  const lp = lenaBody.position;
  let best = null, bd = 0.35;
  for (const item of interactables) {
    if (!item.alive || !FOOD_KINDS[item.kind]) continue;
    const d = Math.hypot(lp.x - item.x, lp.z - item.z);
    if (d < bd && Math.abs(lp.y - item.y) < 0.55) { best = item; bd = d; }

}

}

  world.step(1 / 60, dt, 3);
  for (const c of world.contacts) {
    if (c.bi !== lenaBody && c.bj !== lenaBody) continue;
    if ((c.bi === lenaBody ? -1 : 1) * c.ni.y > 0.5) { groundT = 0.12; break; }
  }

  for (const p of pendingBreaks) if (p.alive) breakProp(p);
  pendingBreaks.clear();
  for (const p of props) {
    if (p.breakCool > 0) p.breakCool -= dt;
    if (!p.alive) { considerMess(p); continue; }
    p.mesh.position.copy(p.body.position);
    p.mesh.quaternion.copy(p.body.quaternion);
    if (p.body.position.y > 1.1) p.high = true;
    if (p.kind === 'brick' && !p.toppled && p.body.quaternion.vmult(upVec).y < 0.7) { p.toppled = true; if (credit('lego')) { sfx('coin'); renderHud(); } }
    if (p.kind === 'book' && !p.toppled) {
      const upright = p.body.quaternion.vmult(upVec).y;
      if (!p.tipped && p.body.velocity.length() > 0.25) {
        p.tipped = true;
        p.tipDir = Math.sign(p.body.velocity.x) || Math.sign(p.body.position.x - lenaBody.position.x) || 1;
      }

      if (p.tipped && upright > 0.85) {
        p.body.wakeUp();
        p.body.angularVelocity.z = -p.tipDir * 5;
        p.body.velocity.x = p.tipDir * 0.35;
        p.body.velocity.z *= 0.2;
      }
      if (upright < 0.7) { p.toppled = true; if (credit('books')) { sfx('coin'); renderHud(); } }
    }
    if (p.kind === 'table' && !p.toppled && p.body.quaternion.vmult(upVec).y < 0.75) {
      p.toppled = true; if (credit('tables')) { addCoins(8); toast('TIMBER! +8'); sfx('timber'); renderHud(); }
    }
    considerMess(p);
  }

  const lp = lenaBody.position;
    disco.cool = Math.max(0, disco.cool - dt);
    if (disco.t <= 0 && disco.cool <= 0 && lp.y < 0.6 && Math.hypot(lp.x - RADIO.x, lp.z - RADIO.z) < 0.4) {
      disco.t = 6; disco.cool = 9; credit('disco'); toast('DISCO TIME!'); renderHud();
    }
    if (disco.t > 0) {
      disco.t -= dt; disco.beat -= dt;
      if (disco.beat <= 0) { disco.beat = 0.22; { const f = [262, 330, 392, 523, 392, 330][disco.i++ % 6]; tone(f, f, 0.18, 'square', 0.06); } }
    }
    for (const pt of paintings) {
      if (!pt.touched && isActive('paintings') && lp.y < 0.5 && Math.hypot(lp.x - pt.x, lp.z - pt.z) < 0.5) {
        pt.touched = true; pt.frame.material.color.setHex(0x55dd66); credit('paintings'); sfx('coin'); toast(`Hi ${pt.emoji}!`); renderHud();
      }
    }
    for (const b of balloons) {
      if (!b.alive || !isActive('balloons')) continue;
      b.ph += dt * 2; b.g.position.y = b.y + Math.sin(b.ph) * 0.04;
      if (Math.hypot(lp.x - b.x, lp.z - b.z, lp.y - b.y) < 0.5) {
        b.alive = false; b.g.visible = false; burst(new THREE.Vector3(b.x, b.y, b.z), b.color, 8);
        credit('balloons'); tone(900, 200, 0.12, 'square', 0.12); toast(`POP! ${Q.balloons}/8`); renderHud();
      }
    }
    updateMarkers(performance.now() / 1000);
    updateHunt(dt);
    updateGarden(dt); updatePizza(dt);
    if (Math.abs(lp.x - HOME.x) < 0.45 && Math.abs(lp.z - HOME.z) < 0.7 && lp.y < 0.4) {
      if (!HOME.in) {
        HOME.in = true;
        if (!HOME.set) { HOME.set = true; LENA_START.set(HOME.x, 0.1, HOME.z); toast("Lina's home! Run out of hearts and you come back here"); }
        if (credit('home')) renderHud();
      }
    } else HOME.in = false;
    BOX.inside = Math.abs(lp.x - BOX.x) < 0.17 && Math.abs(lp.z - BOX.z) < 0.22 && lp.y < 0.3;
    if (BOX.inside) { BOX.t += dt; if (isActive('box')) { timerEl.textContent = `Hiding... ${Math.max(0, Math.ceil(3 - BOX.t))}`; if (BOX.t >= 3) { credit('box'); timerEl.textContent = ''; toast('HIDDEN! Uncle Adam cannot find you'); renderHud(); } } }
    else { BOX.t = 0; if (!HUNT.active) timerEl.textContent = ''; }
  updateAdam(dt);
  lena.position.set(lenaBody.position.x, lenaBody.position.y - 0.14 * LINA_K, lenaBody.position.z);
  lena.rotation.y = yaw;
  if (S.on) shellGroup.rotation.x += dt * 14;
  legs.forEach((l, i) => { l.position.y = 0.06 + Math.max(0, Math.sin(walk + (i % 3 ? 0 : Math.PI))) * 0.03; });
  placeEntityShadow(linaShadow, lena.position.x, lena.position.y, lena.position.z, lena.visible && !firstPerson);
  placeEntityShadow(adamShadow, adam.position.x, adam.position.y, adam.position.z, true);
  placeEntityShadow(droidShadow, droid.g.position.x, droid.g.position.y, droid.g.position.z, true);
  sun.position.set(lenaBody.position.x + 4, 8, lenaBody.position.z + 3); sun.target.position.set(lenaBody.position.x, 0, lenaBody.position.z);
  updateShards(dt);
  updateFloppers(dt);
  tickToast(dt);

  const lp2 = lena.position;
  camera.up.set(0, overview ? 0 : 1, overview ? -1 : 0);
  if (firstPerson) {
    camTight = 0;
    const fx = Math.sin(yaw), fz = Math.cos(yaw);
    camera.position.set(lp2.x + fx * 0.1, lp2.y + 0.1, lp2.z + fz * 0.1);
    camera.lookAt(lp2.x + fx * 3, lp2.y + 0.08 + Math.tan(fpPitch) * 3, lp2.z + fz * 3);
  } else if (overview) {
    camTight = 0;
    const room = roomBox(lp2.x, lp2.z);
    const cx = (room[0] + room[1]) / 2, cz = (room[2] + room[3]) / 2;
    const y = overviewHeight(room);
    const k = Math.min(1, dt * 4);
    camera.position.x += (cx - camera.position.x) * k;
    camera.position.y += (y - camera.position.y) * k;
    camera.position.z += (cz - camera.position.z) * k;
    camera.lookAt(cx, 0, cz);
  } else {
    // orbit around Lina; pull in only where a solid wall blocks the ray (door gaps stay open)
    const el = Math.min(1.45, camEl + camTight * 0.22);
    const rh = camD * Math.cos(camEl), hh = 0.12 + camD * Math.sin(el);
    const idealX = lp2.x + Math.sin(camAz) * rh, idealZ = lp2.z + Math.cos(camAz) * rh;
    const want = clipCamera(lp2.x, lp2.z, idealX, idealZ);
    const idealDist = Math.abs(rh);
    const ratio = idealDist > 1e-4 ? want.dist / idealDist : 1;
    const tightness = Math.max(0, Math.min(1, (0.7 - ratio) / 0.35));
    camTight += (tightness - camTight) * Math.min(1, dt * 5);
    const targetFov = VIEWS[viewIdx].fov + (70 - VIEWS[viewIdx].fov) * camTight;
    const nextFov = camera.fov + (targetFov - camera.fov) * Math.min(1, dt * 6);
    if (Math.abs(nextFov - camera.fov) > 0.02) { camera.fov = nextFov; camera.updateProjectionMatrix(); }
    const k = Math.min(1, dt * 6);
    camera.position.x += (want.x - camera.position.x) * k;
    camera.position.z += (want.z - camera.position.z) * k;
    camera.position.y += (lp2.y + hh - camera.position.y) * k;
    camera.lookAt(lp2.x, lp2.y + 0.1, lp2.z);
  }
  fadeCamOccluders(lp2.x, lp2.y + 0.1, lp2.z);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
