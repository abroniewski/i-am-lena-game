<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ---------- sound (tiny synth, no files) ----------
let ac = null;
function audio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} return ac; }
addEventListener('pointerdown', audio);
addEventListener('keydown', audio);
function tone(f0, f1, dur, type = 'sine', vol = 0.15) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, a.currentTime); o.frequency.exponentialRampToValueAtTime(f1, a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, vol = 0.2) {
  const a = audio(); if (!a) return;
  const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = a.createBufferSource(), g = a.createGain(); g.gain.value = vol;
  src.buffer = buf; src.connect(g); g.connect(a.destination); src.start();
}
function sfx(k) {
  if (k === 'coin') tone(880, 1320, 0.12, 'triangle', 0.1);
  else if (k === 'crash') noise(0.3, 0.25);
  else if (k === 'bonk') tone(320, 70, 0.35, 'square', 0.12);
  else if (k === 'launch') tone(200, 900, 0.45, 'sine', 0.15);
  else if (k === 'timber') tone(140, 50, 0.45, 'sawtooth', 0.12);
  else if (k === 'shell') tone(160, 330, 0.2, 'sine', 0.15);
  else if (k === 'jump') tone(300, 620, 0.14, 'sine', 0.1);
  else if (k === 'win') { tone(523, 1047, 0.5, 'triangle', 0.15); }
}

// ---------- renderer, scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.02, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0x998866, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(4, 8, 3);
sun.castShadow = true;
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
scene.add(sun, sun.target);
const mat = (c) => new THREE.MeshLambertMaterial({ color: c });

// ---------- physics ----------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.8, 0) });
world.allowSleep = true;
world.defaultContactMaterial.friction = 0.35;
world.defaultContactMaterial.restitution = 0.25;
const baseMat = new CANNON.Material('base'); // everything except Lina
// 1 game unit = 1 metre. Origin is the north-west corner of the open kitchen/dining/living area; x runs east, z runs south.
// Layout follows Adam's sketch: open area (10.4 x 8.7 m) with the sliding door on the north wall onto the elevated deck,
// the playroom, hall, powder room and office to the west, the front door and stairs at the south-west.
const YARD = -0.6;   // the yard and lower patio are 0.6 m below the house floor and the deck
function staticBox(hx, hy, hz, x, y, z) {
  const b = new CANNON.Body({ mass: 0, material: baseMat, shape: new CANNON.Box(new CANNON.Vec3(hx, hy, hz)) });
  b.position.set(x, y, z);
  world.addBody(b);
  return b;
}
staticBox(7.4, 0.1, 4.4, 3.0, -0.1, 4.4);              // under the house
staticBox(9.9, 0.1, 6.5, 2.7, YARD - 0.1, -6.5);       // the backyard
staticBox(1.4, 0.1, 4.25, -5.8, YARD - 0.1, 4.25);     // the side yard west of the playroom and office
staticBox(4.545, 0.3, 1.725, 4.545, -0.3, -1.725);     // the elevated deck

// ---------- the house ----------
const wallMat = mat(0xeeeae0);
const WALL_H = 2.7, DOOR_H = 2.1;
// a wall along x (alongX) or along z at position c, from a to b, with doorway gaps [[g0, g1], ...]
function wallSeg(alongX, c, a, b, gaps = [], header = true, h = WALL_H) {
  const cuts = [a, ...gaps.flat(), b];
  for (let i = 0; i < cuts.length; i += 2) {
    const s = cuts[i], e = cuts[i + 1], len = e - s;
    if (len <= 0.01) continue;
    const mid = (s + e) / 2;
    const w = new THREE.Mesh(new THREE.BoxGeometry(alongX ? len : 0.12, h, alongX ? 0.12 : len), wallMat);
    w.position.set(alongX ? mid : c, h / 2, alongX ? c : mid); w.receiveShadow = true; scene.add(w);
    staticBox(alongX ? len / 2 : 0.06, h / 2, alongX ? 0.06 : len / 2, alongX ? mid : c, h / 2, alongX ? c : mid);
  }
  if (header) for (const [g0, g1] of gaps) {
    const hh = h - DOOR_H;
    const m = new THREE.Mesh(new THREE.BoxGeometry(alongX ? g1 - g0 : 0.12, hh, alongX ? 0.12 : g1 - g0), wallMat);
    m.position.set(alongX ? (g0 + g1) / 2 : c, DOOR_H + hh / 2, alongX ? c : (g0 + g1) / 2); scene.add(m);
  }
}
function floorRect(x0, x1, z0, z1, color, planks = false) {
  const f = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, 0.2, z1 - z0), mat(color));
  f.position.set((x0 + x1) / 2, -0.1, (z0 + z1) / 2); f.receiveShadow = true; scene.add(f);
  if (planks) for (let x = Math.ceil(x0 * 5) / 5; x < x1; x += 0.2) {
    const line = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.005, z1 - z0), mat(0xcbb898));
    line.position.set(x, 0.003, (z0 + z1) / 2); scene.add(line);
  }
}
floorRect(0, 10.36, 0, 8.73, 0xe4d5bb, true);          // kitchen, dining, living, entry
floorRect(-4.36, 0, 0, 4.18, 0x9aa0a8);                // playroom (grey carpet)
floorRect(-4.36, -2, 4.18, 5.64, 0xe4d5bb);            // powder room
floorRect(-2, 0, 4.18, 5.64, 0xd8b98a);                // hall
floorRect(-4.36, 0, 5.64, 8.73, 0xe4d5bb, true);       // office
// open area walls
wallSeg(true, 0, 0, 10.36, [[2.36, 4.73]], false);     // north: sliding glass door to the deck
wallSeg(false, 10.36, 0, 8.73);
wallSeg(true, 8.73, 2.7, 10.36); wallSeg(true, 8.73, 0, 2.7, [], false, 5.5);   // south: front door and windows
wallSeg(false, 0, 0, 4.18, [[0.8, 3.2]]);              // west: glass double doors to the playroom
wallSeg(false, 0, 5.64, 8.73, [], false, 5.5);         // the entry is two storeys tall
// west wing
wallSeg(true, 0, -4.36, 0); wallSeg(false, -4.36, 0, 8.73); wallSeg(true, 4.18, -4.36, 0);
wallSeg(true, 5.64, -4.36, 0, [[-1.4, -0.4]]); wallSeg(false, -2, 4.18, 5.64, [[4.4, 5.4]]); wallSeg(true, 8.73, -4.36, 0);

function staticFurniture(w, h, d, x, z, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.position.set(x, h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  staticBox(w / 2, h / 2, d / 2, x, h / 2, z);
  return m;
}
// a box with no physics, just for looks
function deco(w, h, d, x, y, z, color, ry = 0, glass = false) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glass ? new THREE.MeshLambertMaterial({ color, transparent: true, opacity: 0.3 }) : mat(color));
  m.position.set(x, y, z); m.rotation.y = ry; m.castShadow = !glass; m.receiveShadow = true; scene.add(m);
  return m;
}
function signSprite(text, emoji, x, y, z, w = 1.4) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 192;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(40,30,20,0.85)'; g.beginPath(); g.roundRect(6, 6, 500, 180, 28); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '80px serif'; g.fillText(emoji, 256, 62);
  g.font = 'bold 44px sans-serif'; g.fillText(text, 256, 140);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  s.scale.set(w, w * 0.375, 1); s.position.set(x, y, z); scene.add(s);
}
const windowPane = (x, y, z, ry, w, h) => deco(w, h, 0.04, x, y, z, 0xbfe6ff, ry);

// kitchen (north wall): cabinets, double wall oven, fridge with steps, 2.9 m x 1.47 m island with stools, brick oven, pendants
staticFurniture(0.7, 2.2, 0.6, 5.55, 0.3, 0xe8e8e8);
for (const y of [1.2, 1.65]) deco(0.5, 0.3, 0.03, 5.55, y, 0.62, 0x222222);
staticFurniture(2.1, 0.9, 0.6, 6.95, 0.3, 0xf2f2f2); deco(2.1, 0.04, 0.65, 6.95, 0.92, 0.3, 0x555b63);
windowPane(7.0, 1.5, 0.04, 0, 1.2, 0.8);
deco(1.0, 0.55, 0.5, 7.0, 2.2, 0.28, 0xffffff); deco(0.5, 0.35, 0.4, 7.0, 1.9, 0.3, 0xf6f6f6);   // arched range hood
for (const x of [6.15, 7.85]) deco(0.5, 0.9, 0.35, x, 2.15, 0.2, 0xffffff);                       // upper cabinets
for (const x of [5.9, 6.4, 7.6, 8.0]) deco(0.02, 0.1, 0.02, x, 0.75, 0.62, 0x222222);           // black handles
deco(0.3, 0.1, 0.3, 6.4, 0.97, 0.3, 0x2c5aa0);                                                  // blue pot on the counter
staticFurniture(1.47, 0.95, 2.9, 8.13, 2.8, 0x6b7078); deco(1.57, 0.04, 3.0, 8.13, 0.97, 2.8, 0xe9e9e9);
for (const z of [1.9, 2.5, 3.1, 3.7]) staticFurniture(0.34, 0.65, 0.34, 7.1, z, 0x4a4d52);
for (const z of [1.9, 2.8, 3.7]) { deco(0.02, 0.8, 0.02, 8.13, 2.3, z, 0x333333); deco(0.28, 0.22, 0.28, 8.13, 1.8, z, 0xd8f0f5, 0, true); deco(0.1, 0.06, 0.1, 8.13, 1.93, z, 0x222222); }
deco(0.02, 0.6, 0.6, 7.39, 0.5, 3.2, 0x44474c); deco(0.03, 0.5, 0.5, 7.37, 0.5, 3.2, 0x1e2024);   // wine rack on the island
// dining: a live-edge table (3 m) you can run under, ten chairs, chandelier, glass hutch, mat at the sliding door
deco(3.0, 0.06, 1.0, 3.8, 0.76, 2.45, 0x3a2216); staticBox(1.5, 0.03, 0.5, 3.8, 0.76, 2.45);
for (const [x, z] of [[2.4, 2.0], [5.2, 2.0], [2.4, 2.9], [5.2, 2.9]]) { deco(0.07, 0.73, 0.07, x, 0.365, z, 0x1c1c1c); staticBox(0.035, 0.365, 0.035, x, 0.365, z); }
for (const x of [2.7, 3.4, 4.1, 4.8]) for (const z of [1.75, 3.15]) staticFurniture(0.4, 0.45, 0.4, x, z, 0x9a4f2b);
staticFurniture(0.4, 0.45, 0.4, 2.1, 2.45, 0x9a4f2b); staticFurniture(0.4, 0.45, 0.4, 5.5, 2.45, 0x9a4f2b);
for (const x of [2.7, 3.4, 4.1, 4.8]) for (const z of [1.75, 3.15]) deco(0.4, 0.4, 0.04, x, 0.7, z + (z < 2.4 ? -0.2 : 0.2), 0x9a4f2b);   // chair backs
deco(1.4, 0.04, 0.5, 3.8, 2.2, 2.45, 0xc9a24a); deco(0.02, 0.5, 0.02, 3.8, 2.5, 2.45, 0xc9a24a);   // brass chandelier
for (const x of [3.3, 3.8, 4.3]) deco(0.18, 0.18, 0.18, x, 2.05, 2.45, 0xfff0b0);
staticFurniture(0.5, 1.8, 0.9, 0.27, 3.65, 0xdcd2c0); deco(0.03, 1.2, 0.7, 0.54, 1.0, 3.65, 0xaadcf5, 0, true);
deco(2.0, 0.012, 0.8, 3.55, 0.007, 0.55, 0x3d3d44);
// sliding glass doors to the deck: white frames
for (const x of [2.36, 3.55, 4.73]) deco(0.07, 2.1, 0.1, x, 1.05, 0.04, 0xf4f1ea);
deco(2.4, 0.06, 0.1, 3.55, 2.1, 0.04, 0xf4f1ea); windowPane(3.55, 1.05, 0.02, 0, 2.3, 2.0);
// living (south-east): cream L-sectional (back to the dining side) facing the fireplace, console table behind it, blue rug, round coffee table, navy armchairs, piano

function addProp(kind, x, y, z, ry = 0) {
  let mesh, shape, mass;
  if (kind === 'vase') {
    mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.36, 12), mat([0x3aa6c9, 0xd9534f, 0xe9b949][props.length % 3]));
    shape = new CANNON.Box(new CANNON.Vec3(0.1, 0.18, 0.1)); mass = 0.6;
  } else if (kind === 'crate') {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), mat(0xb8803c));
    shape = new CANNON.Box(new CANNON.Vec3(0.15, 0.15, 0.15)); mass = 1;
  } else if (kind === 'ball') {
    mesh = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), mat(0xe04a8a));
    shape = new CANNON.Sphere(0.12); mass = 0.4;
  } else if (kind === 'table') {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.55, 0.45), mat(0x8a5a33));
    shape = new CANNON.Box(new CANNON.Vec3(0.225, 0.275, 0.225)); mass = 3;
  } else if (kind === 'book') {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.32, 0.22), mat([0xc0392b, 0x2980b9, 0x27ae60, 0xf39c12, 0x8e44ad][props.length % 5]));
    shape = new CANNON.Box(new CANNON.Vec3(0.025, 0.16, 0.11)); mass = 0.15;
  } else if (kind === 'brick') {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), mat([0xe74c3c, 0x3498db, 0xf1c40f, 0x2ecc71][props.length % 4]));
    shape = new CANNON.Box(new CANNON.Vec3(0.06, 0.06, 0.06)); mass = 0.05;
  } else if (kind === 'lamp') {
    mesh = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 1.2, 8), mat(0x333333));
    const shade = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.3, 12, 1, true), new THREE.MeshLambertMaterial({ color: 0xffe27a, side: THREE.DoubleSide }));
    shade.position.y = 0.6;
    mesh.add(pole, shade);
    shape = new CANNON.Box(new CANNON.Vec3(0.08, 0.6, 0.08)); mass = 1.5;
  }
  mesh.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  scene.add(mesh);
  const body = new CANNON.Body({ mass, shape, material: baseMat, sleepSpeedLimit: 0.15, sleepTimeLimit: 0.6 });
  body.position.set(x, y, z);
  body.quaternion.setFromEuler(0, ry, 0);
  world.addBody(body);
  const p = { mesh, body, kind, alive: true, breakable: kind === 'vase' || kind === 'lamp', home: { kind, x, y, z, ry } };
  body.addEventListener('collide', (e) => {
    if (p.breakable && p.alive && !p.held && Math.abs(e.contact.getImpactVelocityAlongNormal()) > 1.0) pendingBreaks.add(p);
  });
  props.push(p);
  return p;
}

const shards = [];
const shardGeo = new THREE.BoxGeometry(0.06, 0.06, 0.06);
function burst(pos, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(shardGeo, mat(color));
    m.position.copy(pos);
    scene.add(m);
    shards.push({ m, v: new THREE.Vector3((Math.random() - 0.5) * 3, Math.random() * 3 + 1, (Math.random() - 0.5) * 3), life: 1.3 });
  }
}
function updateShards(dt) {
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.v.y -= 9.8 * dt;
    s.m.position.addScaledVector(s.v, dt);
    if (s.m.position.y < 0.03) { s.m.position.y = 0.03; s.v.set(0, 0, 0); }
    s.m.rotation.x += dt * 6;
    s.life -= dt;
    if (s.life <= 0) { scene.remove(s.m); shards.splice(i, 1); }
  }
}

const timerEl = document.getElementById('timer');
let toastTimer = 0;
function toast(msg) { toastEl.textContent = msg; toastEl.style.opacity = 1; toastTimer = 1.6; }
function checkMissions() {
  for (const m of MISSIONS) {
    if (!isActive(m.key) || Q[m.key] < m.goal) continue;
    missionDone.add(m.key); save.done = [...missionDone]; persist(); addCoins(m.reward);
    const before = active.slice();
    refreshActive();
    const fresh = active.filter((k) => !before.includes(k)).map((k) => MISSIONS.find((x) => x.key === k).name);
    toast(`DONE: ${m.name}! +${m.reward}`);
    if (missionDone.size === MISSIONS.length) setTimeout(() => { toast('LINA WINS! ALL MISSIONS DONE!'); sfx('win'); }, 1700);
    else if (fresh.length) setTimeout(() => toast(`NEW MISSION: ${fresh[0]}`), 1700);
  }
}
function renderHud() {
  checkMissions();
  hud.innerHTML = `<div>🥬 ${coins} &nbsp; 📜 ${missionDone.size}/${MISSIONS.length}</div>`
    + active.map((k) => { const m = MISSIONS.find((x) => x.key === k); return `<div>○ ${m.name}${m.goal > 1 ? ` (${Math.min(Q[k], m.goal)}/${m.goal})` : ''}${k === 'pizza' ? ' ' + PIZZA.items.map((i) => (i.got ? i.e : '▫️')).join('') : ''}</div>`; }).join('');
}
function checkWin() { renderHud(); }
// mission board: the three open missions, then what is done
const missionsEl = document.getElementById('missions');
function openMissions() {
  paused = true; resetStick();
  const row = (m, open) => `<div class="row ${open ? '' : 'done'}"><div><b>${open ? '○' : '✓'} ${m.name}</b><span>${m.desc}${open && m.goal > 1 ? ` (${Math.min(Q[m.key], m.goal)}/${m.goal})` : ''}</span></div><div>🥬 ${m.reward}</div></div>`;
  const doneList = MISSIONS.filter((m) => missionDone.has(m.key));
  const locked = MISSIONS.length - missionDone.size - active.length;
  missionsEl.innerHTML = `<h2>Missions (${missionDone.size}/${MISSIONS.length} done)</h2>`
    + active.map((k) => row(MISSIONS.find((m) => m.key === k), true)).join('')
    + (locked > 0 ? `<div class="row" style="opacity:.6"><div><b>🔒 ${locked} more missions</b><span>Finish one to open the next</span></div></div>` : '')
    + doneList.map((m) => row(m, false)).join('')
    + '<button class="close" id="missionsClose">Back to the game</button>';
  missionsEl.classList.add('open');
}
// feedback: pick a mood, write a note, then share it (the iPad share sheet) or copy it, so the kids can send it to Uncle Adam
const feedbackEl = document.getElementById('feedback');
let fbMood = '';
function openFeedback() {
  paused = true; resetStick();
  feedbackEl.innerHTML = '<h2>What did you think?</h2><div class="moods">' + [['😍', 'Loved it'], ['😕', 'Confusing'], ['🐞', 'Something broke']].map(([e, t]) => `<button data-mood="${e} ${t}">${e} ${t}</button>`).join('')
    + '</div><textarea id="fbText" placeholder="Tell Uncle Adam what was fun, what was hard, what you want next..."></textarea>'
    + '<div class="acts"><button id="fbSend">Send to Uncle Adam</button><button class="close" id="fbClose">Back to the game</button></div>';
  feedbackEl.classList.add('open');
}
feedbackEl.addEventListener('click', async (e) => {
  const m = e.target.dataset && e.target.dataset.mood;
  if (m) { fbMood = m; feedbackEl.querySelectorAll('.moods button').forEach((b) => b.classList.toggle('sel', b === e.target)); return; }
  if (e.target.id === 'fbClose') { feedbackEl.classList.remove('open'); paused = false; return; }
  if (e.target.id === 'fbSend') {
    const note = document.getElementById('fbText').value.trim();
    const text = `I Am Lina feedback (${missionDone.size}/${MISSIONS.length} missions done)\n${fbMood}\n${note}`.trim();
    try { localStorage.setItem('i-am-lena-feedback', text); } catch (err) {}
    try { if (navigator.share) { await navigator.share({ title: 'I Am Lina feedback', text }); return; } } catch (err) { return; }
    try { await navigator.clipboard.writeText(text); e.target.textContent = 'Copied! Paste it in a message'; } catch (err) { e.target.textContent = 'Please tell Uncle Adam!'; }
  }
});
document.getElementById('feedbackBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); openFeedback(); });
missionsEl.addEventListener('click', (e) => { if (e.target.id === 'missionsClose') { missionsEl.classList.remove('open'); paused = false; } });
document.getElementById('missionsBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); openMissions(); });
refreshActive();
renderHud();

function breakProp(p) {
  p.alive = false;
  world.removeBody(p.body);
  scene.remove(p.mesh);
  sfx('crash');
  burst(new THREE.Vector3().copy(p.body.position), p.kind === 'vase' ? 0x3aa6c9 : 0xffe27a, 12);
  if (p.kind === 'vase') { addCoins(5); credit('vases'); toast('CRASH! +5'); }
  else { addCoins(3); toast('CLANG! +3'); }
  renderHud(); checkWin();
}

// ---------- Uncle Adam behaviour ----------
// Slapstick, never violent: a bonk launches him up spinning, he lands dizzy with stars, then shakes it off.
function bonkAdam(prop) {
  if (A.state !== 'patrol') return;
  disco.t = 0;
  if (prop && prop.high && credit('drops')) { addCoins(15); toast('FROM THE RAFTERS! +15'); sfx('bonk'); }
  A.state = 'flying'; A.t = 0; A.bonks++; credit('bonks'); addCoins(10);
  toast('BONK! Uncle Adam! +10'); sfx('bonk');
  renderHud(); checkWin();
}
function updateAdam(dt) {
  const lp = lenaBody.position;
  const dL = Math.hypot(lp.x - adam.position.x, lp.z - adam.position.z);
  A.grace = Math.max(0, A.grace - dt);

  if (A.state === 'flying') {
    A.t += dt;
    const T = 1.8, k = Math.min(1, A.t / T);
    adam.position.y = 2.4 * Math.sin(Math.PI * k);
    adam.rotation.x = k * Math.PI * 2;
    adam.rotation.y += dt * 10;
    if (k >= 1) {
      A.state = 'dizzy'; A.t = 0;
      adam.rotation.x = 0; adam.position.y = 0; stars.visible = true;
      adam.position.x = Math.max(0.4, Math.min(10.0, adam.position.x));
      adam.position.z = Math.max(0.4, Math.min(8.3, adam.position.z));
    }
    return;
  }
  if (A.state === 'dizzy') {
    A.t += dt;
    stars.children.forEach((s, i) => { const a = s.userData.a + A.t * 5; s.position.set(Math.cos(a) * 0.3, Math.sin(A.t * 8 + i) * 0.04, Math.sin(a) * 0.3); });
    adam.rotation.z = Math.sin(A.t * 6) * 0.15;
    if (A.t > 2.2) { A.state = 'patrol'; stars.visible = false; adam.rotation.z = 0; A.grace = 1.5; A.angry = 25; setAdamMood(true); toast('Uncle Adam is MAD! Run!'); }
    return;
  }

  // hit by rolling shell or a flying prop
  const lenaUp = lp.y > 0.8; // up in the rafters, out of his reach
  if (!lenaUp && S.on && dL < 0.5 && lenaBody.velocity.length() > 1.5) { bonkAdam(); return; }
  for (const p of props) {
    if (!p.alive || p.kind === 'table') continue;
    const bp = p.body.position;
    if (bp.y < 2.2 && Math.hypot(bp.x - adam.position.x, bp.z - adam.position.z) < 0.6 && p.body.velocity.length() > 3) { bonkAdam(p); return; }
  }

  if (disco.t > 0) { // the radio is on: Uncle Adam cannot help dancing
    const t = performance.now() / 1000;
    adam.rotation.y += dt * 3;
    adam.position.y = Math.abs(Math.sin(t * 8)) * 0.12;
    aarms[0].rotation.z = 2.4 + Math.sin(t * 9) * 0.4; aarms[1].rotation.z = -2.4 - Math.sin(t * 9) * 0.4;
    alegs[0].rotation.x = Math.sin(t * 8) * 0.5; alegs[1].rotation.x = -Math.sin(t * 8) * 0.5;
    return;
  }
  adam.position.y = 0; aarms[0].rotation.z = 0; aarms[1].rotation.z = 0;
  A.angry = Math.max(0, A.angry - dt);
  if (A.mad && A.angry <= 0) { setAdamMood(false); toast('Uncle Adam calmed down'); }
  const hidden = BOX.inside;
  let target = WAYPOINTS[wp], speed = 1.0;
  if (A.angry > 0 && !S.on && !lenaUp && !hidden && A.grace <= 0 && dL < 3.2) { target = new THREE.Vector3(lp.x, 0, lp.z); speed = 1.3; } // Lina (1.6) can outrun him
  const dx = target.x - adam.position.x, dz = target.z - adam.position.z;
  const d = Math.hypot(dx, dz);
  if (d < 0.2) wp = (wp + 1) % WAYPOINTS.length;
  else {
    adam.position.x += (dx / d) * speed * dt;
    adam.position.z += (dz / d) * speed * dt;
    const want = Math.atan2(dx, dz);
    const diff = Math.atan2(Math.sin(want - adam.rotation.y), Math.cos(want - adam.rotation.y));
    adam.rotation.y += diff * Math.min(1, dt * 6);
    const sw = Math.sin(performance.now() / 180 * speed);
    alegs[0].rotation.x = sw * 0.5; alegs[1].rotation.x = -sw * 0.5;
    aarms[0].rotation.x = -sw * 0.4; aarms[1].rotation.x = sw * 0.4;
  }
  // a tortoise out of her shell gets carried back to the start
  if (A.angry > 0 && !S.on && !lenaUp && !hidden && A.grace <= 0 && dL < 0.45) {
    lenaBody.position.copy(LENA_START); lenaBody.velocity.set(0, 0, 0);
    A.grace = 3;
    toast('Gotcha, Lina! Back to the start!');
  }
}

// ---------- game loop ----------
const SPEED = 1.6, SHELL_SPEED = 3.4;
let yaw = Math.PI, walk = 0;
const clock = new THREE.Clock();
camera.position.set(0.5, 1, 0.5);
const upVec = new CANNON.Vec3(0, 1, 0);
// the camera stays on the same side of the wall as Lina
const CAM_ROOMS = [[0, 10.36, 0, 8.73], [-4.36, 0, 0, 4.18], [-4.36, -2, 4.18, 5.64], [-2, 0, 4.18, 5.64], [-4.36, 0, 5.64, 8.73], [0, 9.09, -3.45, -0.1], [-4.36, 0, -6.9, -0.1], [-7.1, 12.5, -12.9, -0.1], [-7.1, -4.36, 0, 8.4]];
let camRoom = CAM_ROOMS[0];
function camBounds(lx, lz) {
  for (const r of CAM_ROOMS) if (lx >= r[0] && lx <= r[1] && lz >= r[2] && lz <= r[3]) { camRoom = r; break; }
  return { x0: camRoom[0] + 0.15, x1: camRoom[1] - 0.15, z0: camRoom[2] + 0.15, z1: camRoom[3] - 0.15 };
}
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (paused) { renderer.render(scene, camera); requestAnimationFrame(frame); return; }
  let ix = input.x, iy = input.y;
  if (keys.has('a')) ix -= 1;
  if (keys.has('d')) ix += 1;
  if (keys.has('w')) iy -= 1;
  if (keys.has('s')) iy += 1;
  // arrow keys turn and tilt the camera
  const turn = (keys.has('arrowleft') ? 1 : 0) - (keys.has('arrowright') ? 1 : 0), tilt = (keys.has('arrowdown') ? 1 : 0) - (keys.has('arrowup') ? 1 : 0);
  if (turn || tilt) {
    hideHint();
    if (firstPerson) { yaw += turn * 2.0 * dt; fpPitch = Math.max(-0.9, Math.min(0.9, fpPitch - tilt * 1.2 * dt)); }
    else { camAz += turn * 2.0 * dt; camEl = Math.max(0.12, Math.min(1.45, camEl + tilt * 1.2 * dt)); }
  }
  const mag = Math.min(1, Math.hypot(ix, iy));

  if (S.on) { S.t -= dt; if (S.t <= 0) popOut(); }
  else if (S.cool > 0) S.cool -= dt;
  shellBtn.className = S.on ? 'on' : S.cool > 0 ? 'cool' : '';
  shellBtn.textContent = S.on ? Math.ceil(S.t) + '...' : S.cool > 0 ? 'wait' : 'SHELL!';

  const speed = S.on ? SHELL_SPEED : SPEED;
  const n = Math.hypot(ix, iy); if (n > 1) { ix /= n; iy /= n; }
  if (firstPerson) {
    // first person: drag to look, stick walks forward/back and sidesteps
    if (mag > 0.08) {
      lenaBody.velocity.x = (Math.sin(yaw) * -iy - Math.cos(yaw) * ix) * speed;
      lenaBody.velocity.z = (Math.cos(yaw) * -iy + Math.sin(yaw) * ix) * speed;
      walk += dt * 9 * mag;
    } else { lenaBody.velocity.x *= 0.8; lenaBody.velocity.z *= 0.8; }
  } else if (mag > 0.08) {
    // movement is relative to the camera: stick-up walks away from it
    const wx = Math.cos(camAz) * ix + -Math.sin(camAz) * -iy;
    const wz = -Math.sin(camAz) * ix + -Math.cos(camAz) * -iy;
    const target = Math.atan2(wx, wz);
    const d = Math.atan2(Math.sin(target - yaw), Math.cos(target - yaw));
    yaw += d * Math.min(1, dt * 8);
    lenaBody.velocity.x = Math.sin(yaw) * speed * mag;
    lenaBody.velocity.z = Math.cos(yaw) * speed * mag;
    walk += dt * 9 * mag;
  } else {
    lenaBody.velocity.x *= 0.8; lenaBody.velocity.z *= 0.8;
  }
  // jump
  jumpCool = Math.max(0, jumpCool - dt);
  groundT = Math.max(0, groundT - dt);
  if (jumpReq) { jumpReq = false; if (jumpCool <= 0 && groundT > 0 && lenaBody.velocity.y < 0.8) { lenaBody.velocity.y = 4.2; jumpCool = 0.3; sfx('jump'); } }
  // carrying something in front of her
  if (hold.p) {
    const hp = hold.p;
    if (!hp.alive) hold.p = null;
    else {
      hp.body.position.set(lenaBody.position.x + Math.sin(yaw) * 0.3, lenaBody.position.y + 0.1, lenaBody.position.z + Math.cos(yaw) * 0.3);
      hp.body.velocity.set(0, 0, 0); hp.body.angularVelocity.set(0, 0, 0); hp.body.wakeUp();
    }
  }
  grabBtn.textContent = hold.p ? 'THROW!' : 'GRAB'; grabBtn.className = hold.p ? 'hold' : '';
  if (drift.t > 0) { lenaBody.velocity.x += drift.x; lenaBody.velocity.z += drift.z; drift.t -= dt; }
  const onLoft = lenaBody.position.y > 1.2 && lenaBody.position.x < 2.4 && lenaBody.position.z < 0.7;
  if (onLoft && !wasOnLoft && credit('loft')) { addCoins(15); toast('RAFTERS! +15'); renderHud(); }
  wasOnLoft = onLoft;
  const onFridge = lenaBody.position.y > 1.75 && Math.abs(lenaBody.position.x - FRIDGE.x) < 0.45 && Math.abs(lenaBody.position.z - FRIDGE.z) < 0.4;
  if (onFridge && !wasOnFridge && credit('fridge')) renderHud();
  wasOnFridge = onFridge;
  lenaBody.wakeUp();

  world.step(1 / 60, dt, 3);
  for (const c of world.contacts) {
    if (c.bi !== lenaBody && c.bj !== lenaBody) continue;
    if ((c.bi === lenaBody ? -1 : 1) * c.ni.y > 0.5) { groundT = 0.12; break; }
  }

  for (const p of pendingBreaks) if (p.alive) breakProp(p);
  pendingBreaks.clear();
  for (const p of props) {
    if (!p.alive) continue;
    p.mesh.position.copy(p.body.position);
    p.mesh.quaternion.copy(p.body.quaternion);
    if (p.body.position.y > 1.1) p.high = true;
    if (p.kind === 'brick' && !p.toppled && p.body.quaternion.vmult(upVec).y < 0.7) { p.toppled = true; if (credit('lego')) { sfx('coin'); renderHud(); } }
    if (p.kind === 'book' && !p.toppled && p.body.quaternion.vmult(upVec).y < 0.7) { p.toppled = true; if (credit('books')) { sfx('coin'); renderHud(); } }
    if (p.kind === 'table' && !p.toppled && p.body.quaternion.vmult(upVec).y < 0.75) {
      p.toppled = true; if (credit('tables')) { addCoins(8); toast('TIMBER! +8'); sfx('timber'); renderHud(); }
    }
  }

  lena.position.set(lenaBody.position.x, lenaBody.position.y - 0.14 * LINA_K, lenaBody.position.z);
  lena.rotation.y = yaw;
  if (S.on) shellGroup.rotation.x += dt * 14;
  legs.forEach((l, i) => { l.position.y = 0.06 + Math.max(0, Math.sin(walk + (i % 3 ? 0 : Math.PI))) * 0.03; });

  { // mission pack checks
    const lp = lenaBody.position;
    disco.cool = Math.max(0, disco.cool - dt);
    if (disco.t <= 0 && disco.cool <= 0 && lp.y < 0.6 && Math.hypot(lp.x - RADIO.x, lp.z - RADIO.z) < 0.4) {
      disco.t = 6; disco.cool = 9; credit('disco'); toast('DISCO TIME!'); renderHud();
    }
    if (disco.t > 0) {
      disco.t -= dt; disco.beat -= dt;
      if (disco.beat <= 0) { disco.beat = 0.22; { const f = [262, 330, 392, 523, 392, 330][disco.i++ % 6]; tone(f, f, 0.18, 'square', 0.06); } }
    }
    for (const pt of paintings) {
      if (!pt.touched && isActive('paintings') && lp.y < 0.5 && Math.hypot(lp.x - pt.x, lp.z - pt.z) < 0.5) {
        pt.touched = true; pt.frame.material.color.setHex(0x55dd66); credit('paintings'); sfx('coin'); toast(`Hi ${pt.emoji}!`); renderHud();
      }
    }
    for (const b of balloons) {
      if (!b.alive || !isActive('balloons')) continue;
      b.ph += dt * 2; b.g.position.y = b.y + Math.sin(b.ph) * 0.04;
      if (Math.hypot(lp.x - b.x, lp.z - b.z, lp.y - b.y) < 0.3) {
        b.alive = false; b.g.visible = false; burst(new THREE.Vector3(b.x, b.y, b.z), b.color, 8);
        credit('balloons'); tone(900, 200, 0.12, 'square', 0.12); toast(`POP! ${Q.balloons}/8`); renderHud();
      }
    }
    updateHunt(dt);
    updateGarden(dt); updatePizza(dt);
    if (Math.abs(lp.x - HOME.x) < 0.45 && Math.abs(lp.z - HOME.z) < 0.7 && lp.y < 0.4) {
      if (!HOME.in) {
        HOME.in = true;
        if (!HOME.set) { HOME.set = true; LENA_START.set(HOME.x, 0.1, HOME.z); toast("Lina's home! If Uncle Adam catches you, you come back here"); }
        if (credit('home')) renderHud();
      }
    } else HOME.in = false;
    BOX.inside = Math.abs(lp.x - BOX.x) < 0.17 && Math.abs(lp.z - BOX.z) < 0.22 && lp.y < 0.3;
    if (BOX.inside) { BOX.t += dt; if (isActive('box')) { timerEl.textContent = `Hiding... ${Math.max(0, Math.ceil(3 - BOX.t))}`; if (BOX.t >= 3) { credit('box'); timerEl.textContent = ''; toast('HIDDEN! Uncle Adam cannot find you'); renderHud(); } } }
    else { BOX.t = 0; if (!HUNT.active) timerEl.textContent = ''; }
  }
  updateAdam(dt);
  adam.position.x = Math.max(0.4, Math.min(10.0, adam.position.x)); // Uncle Adam stays in the open kitchen / dining / living
  adam.position.z = Math.max(0.4, Math.min(8.3, adam.position.z));
  sun.position.set(lenaBody.position.x + 4, 8, lenaBody.position.z + 3); sun.target.position.set(lenaBody.position.x, 0, lenaBody.position.z);
  updateShards(dt);
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) toastEl.style.opacity = 0; }

  const lp2 = lena.position;
  if (firstPerson) {
    const fx = Math.sin(yaw), fz = Math.cos(yaw);
    camera.position.set(lp2.x + fx * 0.1, lp2.y + 0.1, lp2.z + fz * 0.1);
    camera.lookAt(lp2.x + fx * 3, lp2.y + 0.08 + Math.tan(fpPitch) * 3, lp2.z + fz * 3);
  } else {
    // orbit around Lina, but keep the camera inside the walls so they never block the view
    const rh = camD * Math.cos(camEl), hh = 0.12 + camD * Math.sin(camEl);
    let cx = lp2.x + Math.sin(camAz) * rh, cz = lp2.z + Math.cos(camAz) * rh;
    const b = camBounds(lp2.x, lp2.z);
    cx = Math.max(b.x0, Math.min(b.x1, cx)); cz = Math.max(b.z0, Math.min(b.z1, cz));
    const k = Math.min(1, dt * 6);
    camera.position.x += (cx - camera.position.x) * k;
    camera.position.z += (cz - camera.position.z) * k;
    camera.position.y += (lp2.y + hh - camera.position.y) * k;
    camera.lookAt(lp2.x, lp2.y + 0.1, lp2.z);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
window.__game = { shellCanvas, HOME, LENA_START, PIZZA, droid, lettuces, TREX, hold, grabOrThrow, setView, cycleView, get camAz() { return camAz; }, lenaBody, adam, props, Q, S, A, tuckIn, toggleView, get active() { return active; }, isActive, credit, bugs, HUNT, missionDone, balloons, paintings, BOX, disco, get yaw() { return yaw; }, keys, input, world };
</script>
</body>
